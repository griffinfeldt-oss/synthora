# Local services for Synthora.
#   docker compose up -d            → Postgres on :5432 (matches .env.example)
#   docker compose --profile s3 up -d → also MinIO, an S3-compatible store on :9000 (console :9001)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synthora
      POSTGRES_PASSWORD: synthora
      POSTGRES_DB: synthora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthora"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: synthora
      MINIO_ROOT_PASSWORD: synthora-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the two buckets (public-read and private) on first start.
  minio-setup:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 synthora synthora-minio-dev &&
      mc mb -p local/synthora-public local/synthora-private &&
      mc anonymous set download local/synthora-public;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
